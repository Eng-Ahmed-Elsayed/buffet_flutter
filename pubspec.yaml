name: buffet_app
description: "The Digital Buffet mobile client — employee and staff views."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # §10 — the stack is already settled. Propose before adding to this list.
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  json_annotation: ^4.12.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # §2.4 — bundled, not fetched at runtime, so the app works offline with no CDN.
  generate: true

  assets:
    - assets/images/

  # Cairo ships as a single variable font covering ExtraLight..ExtraBlack.
  # Bundled rather than fetched so the app works offline with no CDN (§2.4).
  # Licence: SIL Open Font License 1.1 — assets/fonts/OFL.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
