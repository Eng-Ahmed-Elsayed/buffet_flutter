# Proof that the iOS target still compiles, from a repository that has no Mac.
#
# There is no signing here and cannot be: a distribution certificate needs the
# paid Apple Developer Program, which is not funded (§7.4, and the same reason
# iOS has no push). `--no-codesign` produces an unsigned Runner.app — enough to
# catch the breakage a Windows-only machine cannot see, which is CocoaPods
# resolution, plugin podspec conflicts, Info.plist and Swift compilation.
#
# When an Apple account is funded, this file gains signing and a TestFlight
# upload; nothing above that step has to change.
name: iOS build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS runners bill at 10x the Linux rate against the free minutes, so this
    # job stays as short as it can be and the concurrency group above kills
    # superseded runs rather than letting them finish.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned, not `stable`: an SDK that moves under CI turns an unrelated
          # push into a red build with no local change to explain it.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: error
