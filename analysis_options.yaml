include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # RTL is not a preference in this app — Arabic is the primary locale, and a
    # hardcoded left/right ships a backwards layout. Treat it as an error, not
    # a suggestion.
    use_named_constants: warning
    always_use_package_imports: ignore

  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Directionality. The dart-guard hook catches EdgeInsets.only(left:) and
    # friends textually; these catch what it cannot see.
    - use_decorated_box
    - avoid_unnecessary_containers

    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unnecessary_statements
    - unawaited_futures

    # Async correctness — the polling screens start timers that must be
    # cancelled when the screen leaves.
    - discarded_futures

    # Style consistent with the existing code
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_child_properties_last
    - require_trailing_commas
    - directives_ordering
